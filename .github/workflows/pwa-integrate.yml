name: Arena SX PWA Audit

on:
  push:
    paths:
      - '.github/workflows/pwa-integrate.yml'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'pwa-register.js'
      - 'index.html'
      - 'icons/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check sw.js
          node --check pwa-register.js
      - name: Validate manifest and required icons
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.webmanifest')); if(!m.name||!m.short_name||!m.start_url||m.display!=='standalone'||!m.theme_color) process.exit(1); const icons=m.icons||[]; for (const size of ['192x192','512x512']) if(!icons.some(i=>i.sizes===size)) process.exit(1); if(!icons.some(i=>(i.purpose||'').includes('maskable'))) process.exit(1);"
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          test -f icons/icon-512-maskable.png
      - name: Validate PWA integration
        run: |
          grep -q 'rel="manifest" href="./manifest.webmanifest"' index.html
          grep -q './pwa-register.js' index.html
          grep -q 'theme-color' index.html
          grep -q 'serviceWorker' pwa-register.js
      - name: Validate private and range cache safety
        run: |
          grep -q "request.headers.has('authorization')" sw.js
          grep -q "request.headers.has('cookie')" sw.js
          grep -q "request.headers.has('range')" sw.js
          grep -q "request.headers.has('if-range')" sw.js
          grep -q "response.headers.has('set-cookie')" sw.js
          grep -q "response.headers.has('content-range')" sw.js
          grep -q "value === 'range'" sw.js
          grep -q "value === 'if-range'" sw.js
          grep -q "key.startsWith(CACHE_PREFIX)" sw.js
